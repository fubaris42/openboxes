# OpenBoxes + MariaDB, based on the upstream docker/docker-compose.yml
# (https://github.com/openboxes/openboxes/tree/develop/docker), flattened for podman-compose.
name: openboxes

services:
  app:
    image: ghcr.io/openboxes/openboxes:${OB_VERSION:-v0.9.8-hotfix1}
    container_name: openboxes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # OB_BIND=0.0.0.0 exposes the app to the LAN; set OB_HOST to the name/IP users will browse to
      - "${OB_BIND:-127.0.0.1}:${OB_PORT:-8081}:8080"
    environment:
      DATASOURCE_URL: jdbc:mysql://db/openboxes?serverTimezone=UTC&useSSL=false
      DATASOURCE_USERNAME: openboxes
      DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # corresponds to grails.serverURL + server.contextPath; must match the URL users browse to
      GRAILS_SERVER_URL: http://${OB_HOST:-localhost}:${OB_PORT:-8081}/openboxes/
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms1024m -Xmx1024m -XX:+UseParallelGC -Djava.awt.headless=true}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: "curl --fail --silent localhost:8080/openboxes/health | grep UP || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5
      # first boot runs the full liquibase migration, which takes several minutes
      start_period: 600s

  db:
    image: docker.io/library/mariadb:10.11
    container_name: openboxes-db
    restart: unless-stopped
    command: --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: openboxes
      MARIADB_USER: openboxes
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dbdata:
  uploads:
